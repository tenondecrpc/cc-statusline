name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm-smoke:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Render fixture
        shell: bash
        run: NO_COLOR=1 node ./bin/cc-statusline.js render < tests/fixtures/with_rate_limits.json
      - name: Show version
        run: node ./bin/cc-statusline.js version
      - name: Configure settings
        shell: bash
        env:
          CCSL_CONFIG_DIR: ${{ runner.temp }}/ccsl-config
          CCSL_SETTINGS_FILE: ${{ runner.temp }}/ccsl-settings.json
        run: |
          node ./bin/cc-statusline.js install --force
          node -e "const s=require(process.env.CCSL_SETTINGS_FILE); if (!s.statusLine || !s.statusLine.command.includes('cc-statusline.js')) process.exit(1)"
      - name: npm global install
        shell: bash
        env:
          CCSL_CONFIG_DIR: ${{ runner.temp }}/ccsl-npm-config
          CCSL_SETTINGS_FILE: ${{ runner.temp }}/ccsl-npm-settings.json
        run: |
          npm install -g . --prefix "${{ runner.temp }}/ccsl-prefix" --ignore-scripts=true
          if [ "$RUNNER_OS" = "Windows" ]; then
            "${{ runner.temp }}/ccsl-prefix/cc-statusline.cmd" install --force
          else
            "${{ runner.temp }}/ccsl-prefix/bin/cc-statusline" install --force
          fi
          node -e "const s=require(process.env.CCSL_SETTINGS_FILE); if (!s.statusLine || !s.statusLine.command.includes('cc-statusline.js')) process.exit(1)"

  smoke:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null 2>&1 || brew install jq
      - name: Smoke tests
        run: bash tests/test.sh
      - name: Sandboxed install
        env:
          CCSL_INSTALL_DIR: /tmp/csl-install
          CCSL_CONFIG_DIR: /tmp/csl-config
          CCSL_SETTINGS_FILE: /tmp/csl-settings.json
          CCSL_WRAPPER_DIR: /tmp/csl-bin
        run: |
          ./install.sh --force --non-interactive
          test -x /tmp/csl-install/statusline.sh
          jq -e '.statusLine.command' /tmp/csl-settings.json
      - name: Sandboxed uninstall
        env:
          CCSL_INSTALL_DIR: /tmp/csl-install
          CCSL_CONFIG_DIR: /tmp/csl-config
          CCSL_SETTINGS_FILE: /tmp/csl-settings.json
          CCSL_WRAPPER_DIR: /tmp/csl-bin
        run: |
          /tmp/csl-install/uninstall.sh --purge
          test ! -d /tmp/csl-install
