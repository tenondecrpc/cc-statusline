name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Smoke tests
        run: bash tests/test.sh
      - name: Sandboxed install
        env:
          CSL_INSTALL_DIR: /tmp/csl-install
          CSL_CONFIG_DIR: /tmp/csl-config
          CSL_SETTINGS_FILE: /tmp/csl-settings.json
        run: |
          ./install.sh --force --non-interactive
          test -x /tmp/csl-install/statusline.sh
          jq -e '.statusLine.command' /tmp/csl-settings.json
      - name: Sandboxed uninstall
        env:
          CSL_INSTALL_DIR: /tmp/csl-install
          CSL_CONFIG_DIR: /tmp/csl-config
          CSL_SETTINGS_FILE: /tmp/csl-settings.json
        run: |
          /tmp/csl-install/uninstall.sh --purge
          test ! -d /tmp/csl-install
